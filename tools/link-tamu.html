<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Link Tamu - Afina & Wisnu</title><script src="https://cdn.tailwindcss.com"></script></head><body class="p-6 bg-[#121812] text-[#E8E6E1]"><h1 class="text-xl font-bold">Pembuat Link Tamu - Afina & Wisnu</h1><p class="text-sm mt-2">Base URL: https://afina-wisnu.pages.dev/</p><div class="mt-4"><label class="flex items-center gap-2"><input type="checkbox" id="hideGift"> Sembunyikan Hadiah (hadiah=0)</label></div><textarea id="names" class="w-full h-40 border p-2 mt-4 bg-[#1e2a1e] text-white rounded" placeholder="Satu nama per baris, contoh:
Bayti Atieq
Bapak Ahmad dan Ibu Siti"></textarea><button onclick="gen()" class="bg-[#C9A55C] text-black px-5 py-2 rounded-full mt-3 font-semibold">Buat Link</button><div id="out" class="mt-6 space-y-3"></div><script>function enc(s){return encodeURIComponent(s).replace(/%20/g,'+');}function gen(){const base='https://afina-wisnu.pages.dev/';const hide=document.getElementById('hideGift').checked;const names=document.getElementById('names').value.split('\n').filter(Boolean);const out=document.getElementById('out');out.innerHTML='';names.forEach(n=>{const clean=n.trim();if(!clean) return;let url=base;const params=[];if(hide) params.push('hadiah=0');params.push('to='+enc(clean));if(params.length) url+='?'+params.join('&');const div=document.createElement('div');div.innerHTML=`<div class='p-4 border rounded-xl border-[#C9A55C]/30 bg-[#1e2a1e]'><b>${clean}</b><br><a href='${url}' target='_blank' class='text-[#C9A55C] break-all text-sm'>${url}</a><br><div class='mt-2 flex gap-2'><button onclick="navigator.clipboard.writeText('${url}')" class='text-xs bg-[#283528] px-3 py-1.5 rounded-full'>Copy</button><a href='https://wa.me/?text=${encodeURIComponent('Undangan Pernikahan Afina & Wisnu - '+url)}' target='_blank' class='text-xs bg-green-700 text-white px-3 py-1.5 rounded-full'>WA</a></div></div>`;out.appendChild(div);});}</script></body></html>
