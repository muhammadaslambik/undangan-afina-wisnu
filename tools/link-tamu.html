<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Link Tamu - Afina & Wisnu</title><script src="https://cdn.tailwindcss.com"></script></head><body class="p-6 bg-[#121812] text-[#E8E6E1]"><h1 class="text-xl font-bold">Pembuat Link Tamu</h1><p class="text-sm mt-2">Base URL: https://afina-wisnu.pages.dev/</p><div class="mt-4"><label><input type="checkbox" id="hideGift"> Sembunyikan Hadiah (hadiah=0)</label></div><textarea id="names" class="w-full h-40 border p-2 mt-4 bg-[#222d22] text-white" placeholder="Satu nama per baris"></textarea><button onclick="gen()" class="bg-[#C9A55C] text-black px-4 py-2 rounded mt-3">Buat Link</button><div id="out" class="mt-4 space-y-2"></div><script>function gen(){const base='https://afina-wisnu.pages.dev/';const hide=document.getElementById('hideGift').checked;const names=document.getElementById('names').value.split('\n').filter(Boolean);const out=document.getElementById('out');out.innerHTML='';names.forEach(n=>{let url=base;const params=[];if(hide) params.push('hadiah=0');params.push('to='+encodeURIComponent(n.trim()));if(params.length) url+='?'+params.join('&');const div=document.createElement('div');div.innerHTML=`<div class='p-3 border rounded border-[#C9A55C]/30'><b>${n}</b><br><a href='${url}' target='_blank' class='text-[#C9A55C] break-all'>${url}</a><br><button onclick="navigator.clipboard.writeText('${url}')" class='mt-2 text-sm bg-[#222d22] px-3 py-1 rounded'>Copy</button> <a href='https://wa.me/?text=${encodeURIComponent('Undangan Pernikahan Afina & Wisnu - '+url)}' }' target='_blank' class='ml-1 text-sm bg-green-700 text-white px-3 py-1 rounded'>WA</a></div>`;out.appendChild(div);})}</script></body></html>
