<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Link Tamu</title><script src="https://cdn.tailwindcss.com"></script></head><body class="p-6"><h1 class="text-xl font-bold">Pembuat Link Tamu - Afina & Wisnu</h1><textarea id="names" class="w-full h-40 border p-2 mt-4" placeholder="Satu nama per baris"></textarea><button onclick="gen()" class="bg-green-700 text-white px-4 py-2 rounded mt-3">Buat Link</button><div id="out" class="mt-4 space-y-2"></div><script>function gen(){const base='https://afina-wisnu.pages.dev/?to=';const names=document.getElementById('names').value.split('\n').filter(Boolean);const out=document.getElementById('out');out.innerHTML='';names.forEach(n=>{const url=base+encodeURIComponent(n.trim());const div=document.createElement('div');div.innerHTML=`<div class='p-2 border rounded'><b>${n}</b><br><a href='${url}' target='_blank' class='text-blue-600'>${url}</a> <button onclick="navigator.clipboard.writeText('${url}')" class='ml-2 text-sm bg-gray-200 px-2 py-1 rounded'>Copy</button> <a href='https://wa.me/?text=${encodeURIComponent('Undangan Pernikahan Afina & Wisnu - '+url)}' }' target='_blank' class='ml-1 text-sm bg-green-600 text-white px-2 py-1 rounded'>WA</a></div>`;out.appendChild(div);})}</script></body></html>
